<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ショートカットクエスト</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#101827;color:#f3f6fc;font:16px system-ui,sans-serif}main{max-width:760px;margin:auto}h1{font-size:2rem}.panel{padding:22px;border:1px solid #354862;border-radius:18px;background:#19263a}.top,.stats,.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.tabs button,button,select{border:1px solid #52647e;border-radius:9px;padding:10px;background:#233550;color:white;font:inherit;cursor:pointer}.tabs button[aria-pressed=true],.primary{background:#16806e}.stats{justify-content:flex-start;margin:18px 0;color:#afbdd0}.stats b{color:white}.bar{height:8px;background:#101a29;border-radius:8px;margin:16px 0}.bar span{display:block;height:100%;background:#6ce0bd}.tag{color:#a6f2d8}.question{font-size:1.5rem;line-height:1.4}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.answer{min-height:60px;text-align:left}.correct{background:#17614f!important;border-color:#6ce0bd}.wrong{background:#653641!important;border-color:#ff8e8e}.feedback{margin:14px 0;min-height:60px;padding:12px;background:#101a29;border-radius:10px;line-height:1.6;color:#afbdd0}.feedback strong{color:white}.primary:disabled{opacity:.4}.screen{display:none}.active{display:block}.summary{text-align:center}.review{text-align:left;line-height:1.6}.review div{margin:6px;padding:9px;background:#101a29;border-radius:8px}.note{color:#afbdd0;font-size:.85rem;line-height:1.5}@media(max-width:540px){.answers{grid-template-columns:1fr}body{padding:14px}}</style><body><main><h1>⌨️ ショートカットクエスト</h1><p>PC操作と資料づくりをクイズで覚えよう。</p><section class="panel"><div class="top"><div class="tabs"><button class="cat" data-cat="all" aria-pressed="true">ミックス</button><button class="cat" data-cat="pc" aria-pressed="false">PC操作</button><button class="cat" data-cat="docs" aria-pressed="false">資料作成</button></div><label>キー配列 <select id="os"><option value="0">Windows</option><option value="1">Mac</option></select></label></div><div id="game" class="screen active"><div class="stats">問題 <b id="count"></b>　正解 <b id="score">0</b>　連続 <b id="streak">0</b></div><div class="bar"><span id="progress"></span></div><span id="tag" class="tag"></span><h2 id="question" class="question"></h2><div id="answers" class="answers"></div><div id="feedback" class="feedback" role="status" aria-live="polite">答えを選ぶと解説が出ます。</div><div class="actions"><span>クリックして回答</span><button id="next" class="primary" disabled>次へ →</button></div></div><div id="summary" class="screen summary"><h2 id="title"></h2><p id="result"></p><div id="review" class="review"></div><button id="again" class="primary">もう一度挑戦</button></div></section><p class="note">資料作成はGoogleドキュメントの操作を中心にしています。アプリや設定でキー操作が異なる場合があります。Macの ⌘ はCommand、⌥ はOptionです。</p></main><script>
const Q=[
["pc","アプリを切り替える","Alt + Tab","⌘ + Tab",["Ctrl + Tab","Alt + F4","Windows + D"],["⌘ + Q","⌃ + Tab","⌘ + F3"],"Alt/Command + Tabでアプリを切り替えます。"],
["pc","閉じたブラウザータブを戻す","Ctrl + Shift + T","⌘ + Shift + T",["Ctrl + T","Ctrl + W","Alt + ←"],["⌘ + T","⌘ + W","⌘ + ←"],"閉じたタブを復元できます。"],
["pc","画面の一部を撮影する","Windows + Shift + S","⌘ + Shift + 4",["Windows + Tab","Alt + Print Screen","Ctrl + Shift + S"],["⌘ + Shift + 3","⌘ + Shift + 5","⌘ + Option + 4"],"範囲を選んでスクリーンショットを撮ります。"],
["pc","今のブラウザータブを閉じる","Ctrl + W","⌘ + W",["Ctrl + Shift + W","Alt + F4","Ctrl + Q"],["⌘ + Q","⌘ + Shift + W","⌃ + W"],"Ctrl/Command + Wは現在のタブを閉じます。"],
["docs","文書を保存する","Ctrl + S","⌘ + S",["Ctrl + P","Ctrl + Shift + S","Ctrl + Enter"],["⌘ + P","⌘ + Shift + S","⌘ + Enter"],"こまめな保存が基本です。Googleドキュメントは自動保存です。"],
["docs","直前の操作を取り消す","Ctrl + Z","⌘ + Z",["Ctrl + Y","Ctrl + X","Ctrl + A"],["⌘ + Shift + Z","⌘ + X","⌘ + A"],"入力や書式の変更をひとつ戻します。"],
["docs","文書の文字をすべて選択する","Ctrl + A","⌘ + A",["Ctrl + E","Ctrl + F","Ctrl + Shift + A"],["⌘ + E","⌘ + F","⌘ + Shift + A"],"文書内の文字をまとめて選択します。"],
["docs","資料内の言葉を探す","Ctrl + F","⌘ + F",["Ctrl + H","Ctrl + G","Ctrl + K"],["⌘ + H","⌘ + G","⌘ + K"],"検索欄を開いて探したい言葉を入力します。"],
["docs","選んだ文字を太字にする","Ctrl + B","⌘ + B",["Ctrl + I","Ctrl + U","Ctrl + Shift + B"],["⌘ + I","⌘ + U","⌘ + Shift + B"],"太字のオン・オフを切り替えます。"],
["docs","Googleドキュメントで書式なし貼り付け","Ctrl + Shift + V","⌘ + Shift + V",["Ctrl + V","Ctrl + Alt + V","Ctrl + Shift + C"],["⌘ + V","⌘ + Option + V","⌘ + Shift + C"],"コピー元の書式を引き継がずに貼り付けます。"],
["docs","Googleドキュメントで改ページする","Ctrl + Enter","⌘ + Enter",["Shift + Enter","Alt + Enter","Ctrl + Shift + Enter"],["Shift + Enter","⌘ + Shift + Enter","⌃ + Enter"],"改ページを入れ、次のページから始められます。"],
["docs","Googleドキュメントで見出し1にする","Ctrl + Alt + 1","⌘ + Option + 1",["Ctrl + Shift + 1","Alt + 1","Ctrl + 1"],["⌘ + Shift + 1","⌥ + 1","⌘ + 1"],"見出しスタイルで文書構造や目次を整理できます。"]
];let cat="all",os=0,deck=[],n=0,score=0,streak=0,locked=false,done=[];const $=x=>document.getElementById(x);function mix(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(){deck=mix(Q.filter(q=>cat==="all"||q[0]===cat)).slice(0,10);n=score=streak=0;done=[];$('game').classList.add('active');$('summary').classList.remove('active');show()}function show(){locked=false;let q=deck[n],a=$('answers');$('count').textContent=(n+1)+' / '+deck.length;$('score').textContent=score;$('streak').textContent=streak+' 🔥';$('progress').style.width=(n/deck.length*100)+'%';$('tag').textContent=q[0]==='pc'?'PC操作':'資料作成';$('question').textContent=q[1];$('feedback').textContent='答えを選ぶと解説が出ます。';$('next').disabled=true;$('next').textContent=n===deck.length-1?'結果を見る →':'次へ →';a.replaceChildren();mix([q[2+os],...q[4+os]]).forEach(v=>{let b=document.createElement('button');b.className='answer';b.innerHTML='<code>'+v+'</code>';b.onclick=()=>answer(b,v,q);a.appendChild(b)})}function answer(b,v,q){if(locked)return;locked=true;let k=q[2+os],ok=v===k;document.querySelectorAll('.answer').forEach(x=>{x.disabled=true;if(x.textContent===k)x.classList.add('correct')});if(ok){score++;streak++;$('feedback').innerHTML='<strong>正解！ '+k+'</strong><br>'+q[6]}else{streak=0;b.classList.add('wrong');$('feedback').innerHTML='<strong>おしい！ 正解は '+k+'</strong><br>'+q[6]}done.push([q,ok]);$('score').textContent=score;$('streak').textContent=streak+' 🔥';$('next').disabled=false}function finish(){let r=$('review');$('game').classList.remove('active');$('summary').classList.add('active');$('title').textContent=score===deck.length?'🏆 パーフェクト！':'ラウンド終了！';$('result').textContent=deck.length+'問中 '+score+'問正解。まちがえた問題も復習しよう。';r.replaceChildren();done.forEach(([q,ok])=>{let d=document.createElement('div');d.textContent=(ok?'✅ ':'🔁 ')+q[1]+' 答え：'+q[2+os]+' — '+q[6];r.appendChild(d)})}document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.cat').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));start()});$('os').onchange=e=>{os=Number(e.target.value);start()};$('next').onclick=()=>n<deck.length-1?(n++,show()):finish();$('again').onclick=start;start();
</script></body></html>
